<!DOCTYPE html>
<html dir="ltr" lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Ahmad Ayash — Senior Graphic Designer</title>
  <!-- All text, images and projects come from content.json (edit them in the dashboard). -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;display=swap" rel="stylesheet"/>
  <script>
   // Pick the language before anything is drawn (avoids a flash of the wrong direction)
   (function () {
     var q = new URLSearchParams(location.search).get('lang'), s = null;
     try { s = localStorage.getItem('lang'); } catch (e) {}
     var l = (q === 'ar' || q === 'en') ? q : (s === 'ar' || s === 'en') ? s : (/^ar/i.test(navigator.language || '') ? 'ar' : 'en');
     if (q) { try { localStorage.setItem('lang', l); } catch (e) {} }
     document.documentElement.lang = l;
     document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
     if (l === 'ar') document.write('<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">');
   })();
  </script>
  <link href="styles.css?v=20261016c" rel="stylesheet"/>
 </head>
 <body>
  <!-- NAVIGATION -->
  <nav>
   <a class="nav-logo" href="#" data-text="site.navLogo"></a>
   <ul class="nav-links">
    <li><a href="#about" data-i18n="nav.about">About</a></li>
    <li><a href="#skills" data-i18n="nav.skills">Skills</a></li>
    <li><a href="#services" data-i18n="nav.services">Services</a></li>
    <li><a href="#portfolio" data-i18n="nav.portfolio">Portfolio</a></li>
    <li id="navReviews" style="display:none"><a href="#reviews" data-i18n="nav.reviews">Reviews</a></li>
    <li><a href="#contact" data-i18n="nav.contact">Contact</a></li>
   </ul>
   <button class="lang-toggle" id="langToggle" type="button" onclick="switchLang()" aria-label="Switch language"><svg class="lang-globe" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span class="lang-label">عربي</span></button>
   <div class="menu-toggle" onclick="toggleMenu()"><span></span><span></span><span></span></div>
  </nav>
  <!-- HERO -->
  <section class="hero" id="about">
   <div class="hero-board">
    <div class="hero-text">
     <div class="hero-tag" data-text="hero.tag"></div>
     <div class="selection" id="heroSel">
      <h1 class="hero-name" id="heroName"></h1>
      <i class="hd hd-tl"></i><i class="hd hd-t"></i><i class="hd hd-tr"></i><i class="hd hd-r"></i>
      <i class="hd hd-br"></i><i class="hd hd-b"></i><i class="hd hd-bl"></i><i class="hd hd-l"></i>
     </div>
     <p class="hero-title" data-text="hero.title"></p>
     <p class="hero-desc" data-text="hero.description"></p>
     <div class="hero-cta">
      <a class="cv-btn" id="cvBtn" href="#" download>
       <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
       <span data-i18n="cv">Download CV</span>
      </a>
      <a class="ghost-btn" href="#contact" data-i18n="hero.contact">Get in touch</a>
     </div>
     <div class="hero-stats" id="heroStats"></div>
    </div>
    <div class="hero-image">
     <figure class="profile-frame">
      <img alt="" decoding="async" fetchpriority="high" id="profileImg"/>
      <i class="crop crop-tl"></i><i class="crop crop-tr"></i><i class="crop crop-bl"></i><i class="crop crop-br"></i>
     </figure>
    </div>
   </div>
  </section>
  <div class="divider"></div>
  <!-- SKILLS -->
  <section class="fade-in" id="skills">
   <div class="section-header">
    <h2 class="section-title" data-i18n="skills.title">TOOLS &amp; SKILLS</h2>
   </div>
   <div class="skills-grid" id="skillsGrid"></div>
  </section>
  <div class="divider"></div>
  <!-- SERVICES -->
  <section class="fade-in" id="services">
   <div class="section-header">
    <h2 class="section-title" data-i18n="services.title">SERVICES</h2>
   </div>
   <div class="services-list" id="servicesList"></div>
  </section>
  <div class="divider"></div>
  <!-- PORTFOLIO -->
  <section class="fade-in" id="portfolio">
   <div class="section-header">
    <h2 class="section-title" data-i18n="portfolio.title">PORTFOLIO</h2>
   </div>
   <div class="portfolio-tabs" id="portfolioTabs"></div>
   <div class="portfolio-grid" id="portfolioGrid"></div>
   <div class="show-more-wrap" id="showMoreWrap" style="display:none"><button class="show-more-btn" id="showMoreBtn" onclick="showMore()">Show more</button></div>
  </section>
  <!-- CLIENT REVIEWS (filled from content.json → reviews; hidden when empty) -->
  <div class="divider" id="reviewsDivider" style="display:none"></div>
  <section class="fade-in" id="reviews" style="display:none">
   <div class="section-header">
    <h2 class="section-title" data-i18n="reviews.title">WHAT CLIENTS SAY</h2>
   </div>
   <div class="reviews-marquee"><div class="reviews-track" id="reviewsTrack"></div></div>
   <p class="reviews-empty" id="reviewsEmpty" style="display:none" data-i18n="reviews.empty">No reviews yet. Worked with me? Be the first to share your experience.</p>
   <div class="reviews-cta" id="reviewsCta" style="display:none">
    <a class="rv-cta-btn" href="review.html"><span class="rv-cta-star">★</span> <span data-i18n="reviews.leave">Leave a review</span></a>
   </div>
  </section>
  <div class="divider"></div>
  <!-- CONTACT -->
  <section class="fade-in" id="contact">
   <div class="section-header">
    <h2 class="section-title" data-i18n="contact.title">LET'S WORK TOGETHER</h2>
   </div>
   <div class="contact-grid" id="contactGrid"></div>
  </section>
  <!-- UNIFIED PROJECT VIEWER -->
  <div class="viewer" id="viewer" onclick="viewerBackdrop(event)">
   <div class="viewer-bar">
    <div class="viewer-meta">
     <h3 id="viewerTitle"></h3>
     <span id="viewerSub"></span>
    </div>
    <div class="viewer-tools">
     <span class="viewer-counter" id="viewerCounter"></span>
     <button class="viewer-close" aria-label="Close" onclick="closeViewer()">&times;</button>
    </div>
   </div>
   <!-- gallery / single mode -->
   <div class="viewer-stage" id="viewerStage" onclick="event.stopPropagation()">
    <button class="viewer-nav viewer-prev" aria-label="Previous" onclick="viewerNav(-1)">&#8249;</button>
    <div class="viewer-imgwrap"><img id="viewerImg" alt=""/></div>
    <button class="viewer-nav viewer-next" aria-label="Next" onclick="viewerNav(1)">&#8250;</button>
   </div>
   <!-- flipbook mode -->
   <div class="flipbook-stage" id="flipStage" onclick="event.stopPropagation()">
    <button class="viewer-nav viewer-prev" aria-label="Previous spread" onclick="flipNav(-1)">&#8249;</button>
    <div class="flipbook" id="flipbook">
     <div class="flip-page flip-left"><img id="flipLeft" alt=""/></div>
     <div class="flip-page flip-right"><img id="flipRight" alt=""/></div>
    </div>
    <button class="viewer-nav viewer-next" aria-label="Next spread" onclick="flipNav(1)">&#8250;</button>
   </div>
   <!-- scroll mode (identity decks) -->
   <div class="scroll-stage" id="scrollStage" onclick="event.stopPropagation()"></div>
   <!-- grid mode (social) -->
   <div class="grid-stage" id="gridStage" onclick="event.stopPropagation()"></div>
  </div>
  <!-- IMAGE LIGHTBOX (popped image from grid) -->
  <div class="imglightbox" id="imgLightbox" onclick="closeImgLightbox(event)">
   <button class="viewer-close imglightbox-close" aria-label="Close" onclick="closeImgLightbox(event)">&times;</button>
   <img id="imgLightboxImg" alt=""/>
  </div>

  <!-- FOOTER -->
  <footer><div class="colorbar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><p id="footer"></p></footer>
  <script src="script.js?v=20261016c"></script>
 </body>
</html>
