<style>
  :root { --black:#0a0a0a; --neon:#22c1ff; --white:#f0f0f0; --gray:#888; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--black); color:var(--white); font-family:'Outfit',sans-serif; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px max(16px,env(safe-area-inset-left)); overflow:hidden; }
  body::before { content:""; position:fixed; width:700px; height:700px; border-radius:50%; background:radial-gradient(circle, rgba(34,193,255,.10), transparent 65%); top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; }
  main { position:relative; max-width:560px; }
  .code { display:flex; align-items:center; justify-content:center; gap:clamp(8px,2vw,18px); font-family:'Bebas Neue',sans-serif; font-size:clamp(120px,26vw,220px); line-height:1; color:var(--white); }
  .code span { display:block; }
  .face { width:clamp(110px,22vw,180px); height:auto; border-radius:50%; animation:bob 2.4s ease-in-out infinite; filter:drop-shadow(0 12px 30px rgba(34,193,255,.35)); }
  .face:hover { animation:spin .8s ease-in-out; }
  @keyframes bob { 50% { transform:translateY(-12px) rotate(-4deg); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { text-wrap:balance; font-family:'Bebas Neue',sans-serif; font-weight:400; font-size:clamp(34px,6vw,52px); letter-spacing:2px; margin-top:18px; }
  p { color:var(--gray); font-size:18px; margin:12px auto 0; max-width:42ch; line-height:1.6; }
  .btn { display:inline-flex; align-items:center; gap:10px; margin-top:34px; background:var(--neon); color:var(--black); font-weight:600; font-size:16px; letter-spacing:1px; text-transform:uppercase; padding:16px 30px; border-radius:40px; text-decoration:none; transition:transform .2s, box-shadow .2s; }
  .btn:hover, .btn:focus-visible { transform:translateY(-3px); box-shadow:0 14px 34px -12px rgba(34,193,255,.6); outline:none; }
  html[dir=rtl] body { font-family:'IBM Plex Sans Arabic','Outfit',sans-serif; }
  html[dir=rtl] h1 { font-family:'Alexandria',sans-serif; font-weight:700; letter-spacing:0; font-size:clamp(28px,5vw,40px); }
  html[dir=rtl] .btn { text-transform:none; letter-spacing:0; font-family:'Alexandria',sans-serif; }
  html[dir=rtl] .code { direction:ltr; }
  @media (prefers-reduced-motion:reduce) { .face { animation:none; } }
</style>
